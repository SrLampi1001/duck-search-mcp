[project]
name = "duck-search-mcp"
version = "0.1.0"
description = "MCP server that exposes the DuckDuckGo Instant Answer API as a free, unauthenticated web_search tool."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "duck-search-mcp contributors" }]
keywords = ["mcp", "model-context-protocol", "duckduckgo", "search", "fastmcp"]
dependencies = [
    "fastmcp==4.0.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
duck-search-mcp = "duck_search_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duck_search_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
